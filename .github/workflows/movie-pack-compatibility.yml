name: Movie pack compatibility

on:
  push:
    branches: [automatic-movie-packs]
  pull_request:
    branches: [automatic-movie-packs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movie-packs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build web interface
        shell: bash
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn tsc --noEmit --skipLibCheck
          yarn build --env production
      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        run: dotnet build src/Radarr.sln
      - name: Test Linux
        if: runner.os == 'Linux'
        shell: bash
        run: dotnet test src/Radarr.sln --no-build --no-restore --filter 'Category!=ManualTest&Category!=IntegrationTest&Category!=AutomationTest&Category!=WINDOWS' --logger trx --results-directory test-results
      - name: Exercise Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ln -sf /usr/bin/ffprobe _output/net8.0/ffprobe
          python scripts/test-movie-packs.py --app _output/net8.0/Radarr.dll
          python scripts/test-movie-packs.py --app _output/net8.0/Radarr.dll --grab-method rss
      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipUi
      - name: Test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assemblies = Get-ChildItem '_tests/net8.0/win-x64/publish/*Test.dll' | Where-Object { $_.Name -notin @('Radarr.Automation.Test.dll', 'Radarr.Integration.Test.dll') } | ForEach-Object FullName
          dotnet vstest $assemblies '/TestCaseFilter:Category!=ManualTest&Category!=IntegrationTest&Category!=AutomationTest&Category!=LINUX' '/Logger:trx' '/ResultsDirectory:test-results'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Windows application and ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-movie-packs.py --app _artifacts/windows/Radarr/Radarr.Console.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive '_artifacts/radarr-multipack-win-x64.zip' '_artifacts/Extracted Windows Package'
          python scripts/test-movie-packs.py --app '_artifacts/Extracted Windows Package/Radarr/Radarr.exe' --grab-method rss --short-paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: test-results/*.trx
          retention-days: 14
      - name: Save Windows package
        if: success() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: radarr-multipack-win-x64
          path: _artifacts/radarr-multipack-win-x64.zip
          compression-level: 0
          retention-days: 7
